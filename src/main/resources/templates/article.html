<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${article.title}">Статья</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 20px; }
        .content { white-space: pre-wrap; line-height: 1.6; }
        a { color: #0066cc; }
    </style>
</head>
<body>
<p><a th:href="@{/}">← Назад к списку</a></p>

<h1 th:text="${article.title}">Заголовок</h1>

<div class="content" th:text="${article.content}">
    Содержание статьи...
</div>
</body>
</html>
