<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактировать статью</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 0 20px; }
        input, textarea { width: 100%; padding: 8px; margin: 5px 0 15px; box-sizing: border-box; }
        textarea { height: 300px; }
        button { padding: 10px 20px; cursor: pointer; }
        a { margin-left: 15px; }
    </style>
</head>
<body>
<h1>Редактировать статью</h1>

<form th:action="@{/admin/edit/{filename}(filename=${article.filename})}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <label>Заголовок:</label>
    <input type="text" name="title" th:value="${article.title}" required>

    <label>Содержание:</label>
    <textarea name="content" required th:text="${article.content}"></textarea>

    <button type="submit">Сохранить изменения</button>
    <a th:href="@{/admin/dashboard}">Отмена</a>
</form>
</body>
</html>
