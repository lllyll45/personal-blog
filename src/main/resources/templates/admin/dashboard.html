<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 30px auto; padding: 0 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #f5f5f5; }
        .actions a { margin-right: 10px; }
        .btn { display: inline-block; padding: 8px 15px; background: #0066cc; color: white; text-decoration: none; border-radius: 4px; }
        .btn:hover { background: #0055aa; }
        .logout { float: right; }
    </style>
</head>
<body>
<h1>Админ-панель
    <form th:action="@{/logout}" method="post" style="display: inline; float: right;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" style="background: none; border: none; color: #0066cc; cursor: pointer; font-size: 16px; padding: 0;">
            Выйти
        </button>
    </form>
</h1>

<p>
    <a th:href="@{/admin/add}" class="btn">+ Добавить статью</a>
    <a th:href="@{/}" class="btn" style="background:#666;">На сайт</a>
</p>

<table>
    <thead>
    <tr>
        <th>Заголовок</th>
        <th>Дата</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="article : ${articles}">
        <td th:text="${article.title}">Заголовок</td>
        <td th:text="${#temporals.format(article.createdAt, 'dd.MM.yyyy HH:mm')}">дата</td>
        <td class="actions">
            <a th:href="@{/admin/edit/{filename}(filename=${article.filename})}">Редактировать</a>
            <a th:href="@{/admin/delete/{filename}(filename=${article.filename})}"
               onclick="return confirm('Удалить статью?')">Удалить</a>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(articles)}">
        <td colspan="3">Статей пока нет</td>
    </tr>
    </tbody>
</table>
</body>
</html>
